<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repositorio de Diplomados — Griky</title>
  <meta name="description" content="Catálogo oficial de SCORMs educativos de Griky. Navega y descarga los contenidos SCORM organizados por Diplomado Avanzado, Diplomado y Unidad." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Open Graph -->
  <meta property="og:title" content="Repositorio de Diplomados — Griky" />
  <meta property="og:description" content="Catálogo de SCORMs educativos de Griky." />
  <meta property="og:type" content="website" />

  <!-- Favicon inline (emoji) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <a class="header-brand" href="#" onclick="renderLevel1();return false;" id="brand-link">
      <img src="logo.jpg" alt="Logo Griky" class="header-logo" id="griky-logo" />
      <span class="header-title">Repositorio de Diplomados — Griky</span>
    </a>

    <div class="header-search">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input
        type="search"
        id="search-input"
        placeholder="Buscar diplomados…"
        autocomplete="off"
        aria-label="Buscar diplomados"
      />
    </div>

    <div class="header-actions">
      <div class="stat-badge"><span id="stat-count">0</span> SCORMs</div>
      <button class="btn btn-primary" id="btn-add" aria-label="Añadir nuevo diplomado">
        + Nuevo Diplomado Avanzado
      </button>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <!-- Breadcrumb -->
    <nav class="breadcrumb" id="breadcrumb" aria-label="Navegación"></nav>

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-title-group">
        <h1 id="page-title">Repositorio de <span class="highlight">Diplomados</span></h1>
        <p class="page-subtitle" id="page-subtitle">Selecciona un Diplomado Avanzado para explorar su contenido</p>
      </div>
    </div>

    <!-- Dynamic View -->
    <section id="view" aria-live="polite"></section>

  </main>

  <!-- ===== MODAL: Añadir nuevo ===== -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Nuevo Diplomado Avanzado</h2>
        <button class="modal-close" onclick="closeModal()" aria-label="Cerrar modal">✕</button>
      </div>

      <form id="modal-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="field-title">Nombre</label>
          <input
            class="form-input"
            type="text"
            id="field-title"
            name="title"
            placeholder="Ej: Diplomado Avanzado 2"
            required
            maxlength="100"
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="field-desc">Descripción (opcional)</label>
          <textarea
            class="form-textarea"
            id="field-desc"
            name="description"
            placeholder="Breve descripción del contenido…"
            maxlength="200"
          ></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="modal-submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== TOASTS ===== -->
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
</body>
</html>
