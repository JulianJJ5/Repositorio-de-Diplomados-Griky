<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repositorio de Diplomados — Griky</title>
  <meta name="description" content="Catálogo oficial de SCORMs educativos de Griky. Navega y descarga los contenidos SCORM organizados por Diplomado Avanzado, Curso y Unidad." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Open Graph -->
  <meta property="og:title" content="Repositorio de Diplomados — Griky" />
  <meta property="og:description" content="Catálogo de SCORMs educativos de Griky." />
  <meta property="og:type" content="website" />

  <!-- Favicon inline (emoji) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />

  <!-- Fuente: con <link> arranca la descarga en paralelo al CSS,
       no después de él como haría un @import dentro de styles.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />

  <!-- El catálogo se pide en cuanto empieza el parseo, sin esperar a app.js -->
  <link rel="preload" href="catalog.json" as="fetch" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <a class="header-brand" href="#" id="brand-link">
      <img src="logo.png" alt="Griky" class="header-logo" width="38" height="38" />
      <span class="header-title">Repositorio de Diplomados — Griky</span>
    </a>

    <div class="header-search">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input
        type="search"
        id="search-input"
        placeholder="Buscar diplomados…"
        autocomplete="off"
        aria-label="Buscar en el catálogo"
      />
      <kbd class="search-hint" aria-hidden="true">/</kbd>
    </div>

    <div class="header-actions">
      <div class="stat-badge">
        <span id="stat-count">0</span> <span id="stat-label">SCORMs</span>
      </div>
      <button class="btn btn-ghost" id="back-btn" type="button" hidden>⬅ Volver</button>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <!-- Breadcrumb -->
    <nav class="breadcrumb" id="breadcrumb" aria-label="Ruta de navegación"></nav>

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-title-group">
        <h1 id="page-title">Repositorio de <span class="highlight">Diplomados</span></h1>
        <p class="page-subtitle" id="page-subtitle">Cargando catálogo…</p>
      </div>
    </div>

    <!-- Vista dinámica -->
    <section id="view" aria-live="polite" aria-busy="true"></section>

    <noscript>
      <div class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <h3>JavaScript desactivado</h3>
        <p>Este catálogo necesita JavaScript para listar los contenidos.</p>
      </div>
    </noscript>

  </main>

  <!-- ===== TOASTS ===== -->
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js" defer></script>
</body>
</html>
